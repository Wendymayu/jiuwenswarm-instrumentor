name: release

# Publish to PyPI on tag push (v*), using OIDC trusted publishing — NO API token.
# One-time setup on PyPI: https://pypi.org/manage/project/jiuwenswarm-instrumentor/settings/publishing/
#   add a GitHub publisher → owner: Wendymayu, repo: jiuwenswarm-instrumentor,
#   workflow filename: release.yml, environment: (leave blank).
# Also supports workflow_dispatch for retroactive/manual releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for PyPI OIDC trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch the tag so version extraction + build match the tagged commit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Verify .pth at wheel root
        run: |
          python - <<'PY'
          import zipfile, glob
          f = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(f).namelist()
          assert 'jiuwenswarm_instrumentor.pth' in names, 'pth missing from wheel root'
          assert any(n.endswith('_autoload.py') for n in names), '_autoload missing'
          assert any(n.endswith('_env.py') for n in names), '_env missing'
          print('wheel ok:', f)
          PY

      - name: Publish to PyPI (OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
