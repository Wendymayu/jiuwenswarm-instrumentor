[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenswarm-instrumentor"
dynamic = ["version"]
description = "Standalone OpenTelemetry auto-instrumentation for jiuwenclaw / openjiuwen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.optional-dependencies]
estimate = ["tiktoken>=0.7.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jiuwen-instrument = "jiuwenswarm_instrumentor.activate:main"
jiuwen-instrument-install-pth = "jiuwenswarm_instrumentor._install_pth:main"

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: _version.py. pyproject reads it via
# setuptools dynamic version (attr), so a release only needs to bump
# _version.py + the smoke-test guard in tests/test_smoke.py.
[tool.setuptools.dynamic]
version = {attr = "jiuwenswarm_instrumentor._version.__version__"}

# The wheel-root `jiuwenswarm_instrumentor.pth` is injected by setup.py's build_py
# cmdclass (data-files does NOT reliably land .pth in site-packages for wheels).
# A non-editable `pip install .` drops that .pth into site-packages, where CPython's
# site module runs its `import` line at every interpreter startup → fires
# _autoload._autoload() in every Python process in this venv, including subprocesses
# forked by jiuwenclaw.app. Editable installs don't ship the .pth — run
# `jiuwen-instrument-install-pth` after `pip install -e .` (see _install_pth.py).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
